# Run-parameter config for run_uwb3d_quanta.py on synthetic cavitation data.
# Uses cavitation_synth (fps read from zarr metadata).
#   python run_uwb3d_quanta.py --run config/runs/uwb3d_cavitation.yaml

# Name of a data-type config in config/data_types (without the .yaml extension).
data_type: cavitation_synth

output_subdir: results/phantom-synth

datanames:
  - cavitation1_rife4_linear8_ppp1
  # - cavitation1_rife0_linear1_ppp0.1
  # - cavitation1_rife2_linear1_ppp0.1
  # - cavitation1_rife4_linear8_ppp0.1

target_fps: [100000]
keep_probs: [1.0]
alpha: 1.0e-3

# Correct hot pixels on the source frames before reconstruction.
# Data converted with data_convert.ipynb is already corrected, so this is normally false.
hotpixel_correction: false

# Slices are "start:stop" or "start:stop:step" strings; a ["t", "y", "x"] list
# slices all three dimensions (e.g. ["0:1000", "100:400", ":"]). null = no slice.
frame_slice: null
recon_slice: ":"        # full reconstruction (do not look up per-dataset slice)

window: hann
window_kwargs: null

window_settings:
  chunk_t: 10000
  chunk_h: 32
  chunk_w: 32
  hop_t: 2500
  hop_h: 8
  hop_w: 8
