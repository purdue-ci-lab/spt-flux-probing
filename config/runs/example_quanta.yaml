# Example run-parameter config for run_uwb3d_quanta.py.
#   python run_uwb3d_quanta.py --run config/runs/uwb3d_spad512.yaml
# or uv run also works
#   uv run run_uwb3d_quanta.py --run config/runs/uwb3d_spad512.yaml

# Name of a data-type config in config/data_types (without the .yaml extension).
data_type: spad512_100k

output_subdir: results/quanta    # output location relative to config.OUTPUT_DIR

# List of datasets to run on. Paths are resolved like config.DATA_DIR / data_subdir / dataname.
# Configure 
datanames:
  - Feb29_balloonbounce_acq0_2875ppps.zarr
  - Feb28_blender_acq7_2986ppps.zarr

# The total number of runs will be a product of these lists.
target_fps: [100000, 10000]      # target reconstruction FPS
keep_probs: [1.0, 0.1]           # the fraction of photons to keep (1.0 = all, 0.1 = 10%)

alpha: 1.0e-4

# Correct hot pixels on the source frames before reconstruction.
# Normally the data should already be corrected since it takes a while to correct,
# so if your data is already preprocessed, set this to false.
hotpixel_correction: false

# Slices are "start:stop" or "start:stop:step" strings; a ["t", "y", "x"] list
# slices all three dimensions (e.g. ["0:1000", "100:400", ":"]). null = no slice.
# frame_slice crops the source frames before reconstruction; recon_slice picks the
# region of the reconstruction to write out. ":" is a full slice, null is no slice --
# only null makes recon_slice fall back to config/recon_slices.yaml, and only when
# frame_slice keeps the full data (the recon_slices.yaml indices are into the full data).
frame_slice: ":"                 # e.g. ["0:50000", "128:384", "128:384"]
recon_slice: null                # look up config/recon_slices.yaml

window: hann                     # just use Hann. others are available but will barely change the result.
window_kwargs: null

# Used to control the size of the chunks and hops for the STFT.
# For example, this is a TxHxW chunk size of 10000x100x100 and a hop size of 2500x25x25.
# The chunk overlap for this setup is 75% for higher quality video, but can be reduced
# to 50% for faster processing at the cost of quality.
# Note the only valid overlaps for the Hann window are 1/2, 2/3, 3/4, 4/5, ... (50%, 66%, 75%, 80%, ...)
# since they satisfy COLA.
window_settings:
  chunk_t: 10000
  chunk_h: 100
  chunk_w: 100
  hop_t: 2500
  hop_h: 25
  hop_w: 25
