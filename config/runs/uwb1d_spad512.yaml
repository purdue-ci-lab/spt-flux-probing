# Run-parameter config for run_uwb1d_quanta.py on 100k fps SPAD512 quanta data.
#   python run_uwb1d_quanta.py --run config/runs/uwb1d_spad512.yaml

# Name of a data-type config in config/data_types (without the .yaml extension).
data_type: spad512_100k

output_subdir: results/uwb1d/quanta

datanames:
  - Feb28_balloonBounce_acq0_2221ppps

target_fps: [1000, 10000, 100000]
keep_probs: [1.0, 0.05, 0.02, 0.01]
alpha: null

# Correct hot pixels on the source frames before reconstruction.
# Data converted with data_convert.ipynb is already corrected, so this is normally false.
hotpixel_correction: false

# Slices are "start:stop" or "start:stop:step" strings; a ["t", "y", "x"] list
# slices all three dimensions (e.g. ["0:1000", "100:400", ":"]). null = no slice.
frame_slice: null
recon_slice: null                # look up config/recon_slices.yaml, else default cap

max_frames_recon_default: 2000
