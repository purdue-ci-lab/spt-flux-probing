# Run-parameter config for run_uwb1d_quanta.py on 100k fps SPAD512 quanta data.
#   python run_uwb1d_quanta.py --data-type config/data_types/spad512_100k.yaml \
#       --run config/runs/uwb1d_spad512.yaml
output_subdir: results/uwb1d/quanta

datanames:
  - Feb28_balloonBounce_acq0_2221ppps

target_fps: [1000, 10000, 100000]
keep_probs: [1.0, 0.05, 0.02, 0.01]
alpha: null

frame_slice: null
recon_slice: null                # look up config/recon_slices.yaml, else default cap

max_frames_recon_default: 2000
