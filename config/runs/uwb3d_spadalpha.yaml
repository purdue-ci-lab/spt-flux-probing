# Run-parameter config for run_uwb3d_quanta.py on 100k fps SPAD512 quanta data.
#   python run_uwb3d_quanta.py --run config/runs/uwb3d_spadalpha.yaml

# Name of a data-type config in config/data_types (without the .yaml extension).
data_type: spadalpha_56k

output_subdir: results/quanta-megapix    # output location relative to config.OUTPUT_DIR

datanames:
  - acq00040-laser-close.zarr
  # - acq00042-laser-far.zarr
  # - acq00043-laser-far-less-exposure-per-frame.zarr

target_fps: [1000]
keep_probs: [1.0]
alpha: 1.0e-4

# Correct hot pixels on the source frames before reconstruction.
hotpixel_correction: false

# Slices are "start:stop" or "start:stop:step" strings; a ["t", "y", "x"] list
# slices all three dimensions (e.g. ["0:1000", "100:400", ":"]). null = no slice.
frame_slice: [":", ":", ":"]
recon_slice: null                # look up config/recon_slices.yaml

window: hann
window_kwargs: null

window_settings:
  chunk_t: 10000
  chunk_h: 100
  chunk_w: 100
  hop_t: 250
  hop_h: 25
  hop_w: 25
