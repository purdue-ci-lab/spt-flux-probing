[project]
name = "spt-flux-probing"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dask>=2026.3.0",
    "dill>=0.4.1",
    "finufft>=2.5.1",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    # numba (via sparse) requires numpy<2.5; without this cap uv's universal
    # resolution picks numpy 2.5 for py>=3.12 and backtracks numba to 0.53.1
    "numpy>=2.4.6,<2.5",
    "opencv-python>=4.13.0.92",
    "pandas>=3.0.3",
    "plotly>=6.8.0",
    "pyyaml>=6.0.3",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "spadlib",
    "sparse>=0.19.0",
    "tifffile>=2026.3.3",
    "tqdm>=4.67.3",
    "zarr>=3.1.6",
]

[tool.uv.sources]
spadlib = { git = "https://github.com/purdue-ci-lab/spadlib.git" }

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sptflux"]
