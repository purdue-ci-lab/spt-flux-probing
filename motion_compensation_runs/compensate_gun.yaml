experiment_name: gun

data:
  path: ./data/gun_2.bin
  type: bin
  T_exp: 1.0
  frames: 100000
  width: 512
  height: 512
  slice: [23000, 27000]
  velocity_bounds: [0.0, 0.1, 100]

window_settings:
    patch_num: 0
    window_size: 512
    window_stride: 32
    temporal_size: 1000

output:
  base_path: ./output/gun/
  sub_folder: "slice_{slice_start}_{slice_end}_width_{width}_height_{height}_velocity_bounds_{vmin}_{vmax}_N{n_vel}_window_size_{window_size}_window_stride_{window_stride}_temporal_size_{temporal_size}_patch_num_{patch_num}"
  bin_video_path: "gun.mp4"
  two_dimensional_energies_path: "gun_2d_energies.svg"
  two_dimensional_detections_path: "gun_2d_detections.svg"
  two_dimensional_motion_compensated_path: "gun_2d_motion_compensated.svg"