experiment_name: toys

data:
  path: ./data/toys_moving/
  T_exp: 1.0
  type: zarr
  frames: 130000
  width: 512
  height: 256
  slice: [25000, 29000]
  velocity_bounds: [-0.03, 0.0, 300]

window_settings:
    patch_num: 1
    window_size: 256
    window_stride: 256
    temporal_size: 2000

output:
  base_path: ./output/toys_moving/
  sub_folder: "slice_{slice_start}_{slice_end}_width_{width}_height_{height}_velocity_bounds_{vmin}_{vmax}_N{n_vel}_window_size_{window_size}_window_stride_{window_stride}_temporal_size_{temporal_size}_patch_num_{patch_num}"
  bin_video_path: "toys_moving.mp4"
  two_dimensional_energies_path: "toys_moving_2d_energies.svg"
  two_dimensional_detections_path: "toys_moving_2d_detections.svg"
  two_dimensional_motion_compensated_path: "toys_moving_2d_motion_compensated"